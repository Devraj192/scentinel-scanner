[package]
name = "sentinelscan"
version = "1.0.1"
edition = "2021"
description = "Authorized-only network discovery and TCP port scanner"
license = "MIT"

[[bin]]
name = "sentinelscan"
path = "src/main.rs"

[dependencies]
sentinelscan-core = { version = "1.0.1", path = "../sentinelscan-core" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "sync", "time", "process"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1.2"

[target.'cfg(unix)'.dependencies]
rlimit = "0.10"
