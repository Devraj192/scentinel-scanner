[package]
name = "sentinelscan-core"
version = "1.0.1"
edition = "2021"
description = "Engine for SentinelScan: safe bounded network scanning as a library"
license = "MIT"

[lib]
name = "sentinelscan_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
ipnet = "2.9"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["net", "time", "sync", "signal", "macros", "rt-multi-thread", "io-util"] }
toml = "0.8"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
rlimit = "0.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1.0"

[[bench]]
name = "scan"
harness = false
