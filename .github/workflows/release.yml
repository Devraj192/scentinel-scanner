name: release

# Release checklist (human steps, once per release):
# 1. All PRD acceptance criteria pass; CHANGELOG updated.
# 2. `cargo publish` token stored as CARGO_REGISTRY_TOKEN (crates.io, scoped).
# 3. Push tag vX.Y.Z. This workflow publishes crates, builds every artifact,
#    creates the GitHub Release, and proves each install channel in containers.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  publish:
    # Crates first: binstall and cargo-install tests below need the real registry.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish -p sentinelscan-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 60
      - run: cargo publish -p sentinelscan
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  meta:
    # Completions and man page, generated by the binary itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p sentinelscan
      - run: |
          mkdir -p packaging/completions packaging/man
          ./target/release/sentinelscan completions bash > packaging/completions/sentinelscan.bash
          ./target/release/sentinelscan completions zsh > packaging/completions/sentinelscan.zsh
          ./target/release/sentinelscan completions fish > packaging/completions/sentinelscan.fish
          ./target/release/sentinelscan man > packaging/man/sentinelscan.1
      - uses: actions/upload-artifact@v4
        with:
          name: meta
          path: packaging/

  musl:
    needs: [meta]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            install: sudo apt-get update && sudo apt-get install -y musl-tools
            build: cargo build --release -p sentinelscan --target x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            install: cargo install cross --locked
            build: cross build --release -p sentinelscan --target aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: ${{ matrix.install }}
      - run: ${{ matrix.build }}
      - uses: actions/download-artifact@v4
        with:
          name: meta
          path: packaging/
      - run: |
          STAGE="dist/${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/sentinelscan" "$STAGE/sentinelscan"
          cp packaging/completions/sentinelscan.bash packaging/completions/sentinelscan.zsh packaging/completions/sentinelscan.fish "$STAGE/"
          cp packaging/man/sentinelscan.1 "$STAGE/"
          cp packaging/sentinelscan-installer.sh "$STAGE/"
          tar -czf "sentinelscan-${VERSION}-${{ matrix.target }}.tgz" -C "$STAGE" sentinelscan sentinelscan.bash sentinelscan.zsh sentinelscan.fish sentinelscan.1 sentinelscan-installer.sh
          sha256sum "sentinelscan-${VERSION}-${{ matrix.target }}.tgz" > "SHA256SUMS-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            sentinelscan-*.tgz
            SHA256SUMS-*

  packages:
    # .deb and .rpm for x86_64 (other arches ship tarballs).
    needs: [musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo install cargo-deb cargo-generate-rpm --locked
      - uses: actions/download-artifact@v4
        with:
          name: meta
          path: packaging/
      - run: cargo build --release -p sentinelscan --target x86_64-unknown-linux-musl
      - run: cargo deb --target x86_64-unknown-linux-musl -p sentinelscan
      # generate-rpm locates the package at <name>/Cargo.toml relative to the
      # workspace root, so link the nested crate dir into place (CI only).
      - run: ln -s crates/sentinelscan sentinelscan
      - run: cargo generate-rpm --target x86_64-unknown-linux-musl -p sentinelscan
      - run: |
          find target \( -name '*.deb' -o -name '*.rpm' \) -execdir sha256sum {} + | sed 's| \./|  |' | sort > SHA256SUMS-packages
          cat SHA256SUMS-packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            target/**/debian/*.deb
            target/**/generate-rpm/*.rpm
            SHA256SUMS-packages

  release:
    # Ships even if the registry publish is still waiting on its token:
    # artifacts come from this repo, not from crates.io.
    needs: [musl, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: packages
      - run: |
          find . -name 'SHA256SUMS-*' -exec cat {} + > SHA256SUMS
          find . -mindepth 2 \( -name 'sentinelscan-*.tgz' -o -name '*.deb' -o -name '*.rpm' \) -exec mv -n -t . {} +
          sha256sum -c SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sentinelscan-*.tgz
            SHA256SUMS
            **/*.deb
            **/*.rpm
            packaging/sentinelscan-installer.sh

  container:
    needs: [musl]
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.target }}
      - run: tar -xzf sentinelscan-*.tgz sentinelscan && mv sentinelscan packaging/sentinelscan-${{ matrix.arch }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: packaging
          push: true
          tags: ghcr.io/devraj192/sentinel-scanner:${{ github.ref_name }}-linux-${{ matrix.arch }}
          build-args: BINARY=sentinelscan-${{ matrix.arch }}

  container-manifest:
    needs: [container]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: >
          docker buildx imagetools create
          -t ghcr.io/devraj192/sentinel-scanner:${{ github.ref_name }}
          ghcr.io/devraj192/sentinel-scanner:${{ github.ref_name }}-linux-amd64
          ghcr.io/devraj192/sentinel-scanner:${{ github.ref_name }}-linux-arm64

  install-registry:
    # Needs the crates published first; fails cleanly until the registry
    # token exists, without blocking artifact channels.
    needs: [publish]
    strategy:
      matrix:
        include:
          - image: archlinux:base
            channel: binstall
          - image: alpine:3.21
            channel: cargo
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: binstall channel
        if: matrix.channel == 'binstall'
        run: |
          TAG="${{ github.ref_name }}"; VER="${TAG#v}"
          pacman -Sy --noconfirm curl python rustup
          rustup toolchain install stable
          rustup default stable
          curl -LsSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y sentinelscan@${VER}
          sentinelscan --version
      - name: cargo channel
        if: matrix.channel == 'cargo'
        run: |
          TAG="${{ github.ref_name }}"; VER="${TAG#v}"
          apk add --no-cache curl python3 rustup musl-dev gcc
          rustup-init -y --default-toolchain stable
          source "$HOME/.cargo/env"
          cargo install sentinelscan --version "${VER}"
          sentinelscan --version

  install-artifacts:
    # Everything built in this repo: no registry needed.
    needs: [release, container-manifest]
    strategy:
      matrix:
        include:
          - image: ubuntu:24.04
            channel: script
          - image: debian:12
            channel: deb
          - image: fedora:41
            channel: rpm
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: install script channel
        if: matrix.channel == 'script'
        run: |
          apt-get update && apt-get install -y curl ca-certificates tar python3
          curl -LsSf "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/sentinelscan-installer.sh" | sh
          sentinelscan --version
          python3 -m http.server 8000 --bind 127.0.0.1 &
          sleep 2
          sentinelscan scan 127.0.0.1 --ports 8000 --profile quick --yes --skip-host-discovery | grep -q open
      - name: tampered artifact is refused
        if: matrix.channel == 'script'
        run: |
          curl -LsSf "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS" -o SHA256SUMS
          curl -LsSf "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/sentinelscan-${{ github.ref_name }}-x86_64-unknown-linux-musl.tgz" -o good.tgz
          cp good.tgz bad.tgz && printf tampered >> bad.tgz
          ! grep "sentinelscan-${{ github.ref_name }}-x86_64-unknown-linux-musl.tgz$" SHA256SUMS | sed 's/good/bad/' | sha256sum -c -
      - name: deb channel
        if: matrix.channel == 'deb'
        run: |
          apt-get update && apt-get install -y curl python3
          curl -LsSf "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS" -o SHA256SUMS
          DEB="$(grep '\.deb$' SHA256SUMS | awk '{print $2}')"
          curl -LsSf "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$DEB" -o scan.deb
          dpkg -i scan.deb
          sentinelscan --version
          test -f /usr/share/man/man1/sentinelscan.1
          test -f /usr/share/bash-completion/completions/sentinelscan
          dpkg -r sentinelscan
          test ! -e /usr/bin/sentinelscan
      - name: rpm channel
        if: matrix.channel == 'rpm'
        run: |
          dnf install -y curl python3 findutils
          curl -LsSf "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS" -o SHA256SUMS
          RPM="$(grep '\.rpm$' SHA256SUMS | awk '{print $2}')"
          curl -LsSf "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$RPM" -o scan.rpm
          dnf install -y ./scan.rpm
          sentinelscan --version
          test -f /usr/share/man/man1/sentinelscan.1
          dnf remove -y sentinelscan

  docker:
    # The published image runs and reports itself.
    needs: [container-manifest]
    runs-on: ubuntu-latest
    steps:
      - run: docker run --rm ghcr.io/devraj192/sentinel-scanner:${{ github.ref_name }} --version
      - run: docker run --rm ghcr.io/devraj192/sentinel-scanner:${{ github.ref_name }} doctor
