[package]
name = "sentinelscan"
version = "0.5.0"
edition = "2021"
description = "Authorized-only network discovery and TCP port scanner"
license = "MIT"

[[bin]]
name = "sentinelscan"
path = "src/main.rs"

[lib]
name = "sentinelscan"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ipnet = "2.9"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["net", "time", "sync", "signal", "macros", "rt-multi-thread", "process", "io-util"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "scan"
harness = false
