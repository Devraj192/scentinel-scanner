[package]
name = "sentinelscan"
version = "0.1.0"
edition = "2021"
description = "Authorized-only network discovery and TCP port scanner (Phase 1: parsing + safety, no traffic)"
license = "MIT"

[[bin]]
name = "sentinelscan"
path = "src/main.rs"

[lib]
name = "sentinelscan"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ipnet = "2.9"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1.2"
